name: Release

permissions: read-all

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'zebodotdev/inttegro-sdk-dart'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Verify the release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: \(.*\)$/\1/p' pubspec.yaml)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
          if [[ "${version}" == "0.1.0" ]]; then
            curl -fsSL https://pub.dev/api/packages/inttegro \
              | jq -e '.versions | any(.version == "0.1.0")' >/dev/null
          fi
      - name: Run release checks and archive the source
        shell: bash
        run: |
          set -euo pipefail
          dart pub token remove https://pub.dev
          unset PUB_TOKEN
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
          dart pub publish --dry-run
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          git archive --format=tar --prefix="inttegro-sdk-dart-${version}/" "${GITHUB_SHA}" \
            | gzip -n > "artifacts/inttegro-sdk-dart-${version}.tar.gz"
      - name: Attest the source archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*.tar.gz
      - name: Record release provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" artifacts/ATTESTATIONS.sigstore
          {
            echo "repository=https://github.com/${GITHUB_REPOSITORY}"
            echo "tag=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW_REF}"
            echo "package=inttegro"
          } > artifacts/PROVENANCE.txt
          (cd artifacts && sha256sum ./*.tar.gz ./ATTESTATIONS.sigstore ./PROVENANCE.txt > SHA256SUMS)
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --draft
          --generate-notes
          --title "Inttegro Dart SDK ${GITHUB_REF_NAME}"
          --verify-tag

  publish:
    needs: verify
    if: github.ref_name != 'v0.1.0'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Dart and request a pub.dev credential
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Resolve dependencies without the publish credential
        shell: bash
        run: |
          set -euo pipefail
          dart pub token remove https://pub.dev
          dart pub get
      - name: Publish to pub.dev with OIDC
        run: dart pub publish --force

  finalize:
    needs: [verify, publish]
    if: >-
      ${{ always() && needs.verify.result == 'success' &&
      (needs.publish.result == 'success' ||
      (github.ref_name == 'v0.1.0' && needs.publish.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Finalize the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
